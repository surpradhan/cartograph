# Dependabot configuration — keeps our dependencies current:
#   - SHA-pinned GitHub Actions (.github/workflows/ci.yml)
#   - uv-managed Python packages (pyproject.toml / uv.lock)
#
# CI pins every `uses:` in .github/workflows/ci.yml to a full 40-char commit
# SHA with a trailing `# vX.Y.Z` version comment. That pinning is our defence
# against the tj-actions class of mutable-tag attack (a compromised action repo
# re-pointing a tag like `@v6` at malicious code). The trade-off: a SHA never
# moves on its own, so without automation we silently miss upstream security
# and bug-fix releases.
#
# Dependabot closes that gap. It reads the version comment, discovers newer
# releases, and opens a PR that bumps BOTH the pinned SHA and the comment —
# keeping us pinned *and* current. Bump PRs run through the same required
# checks and human review as any other change (we never self-merge).
#
# The same logic applies to the uv ecosystem below: pyproject.toml lower
# bounds and uv.lock would otherwise drift, silently missing upstream security
# and bug-fix releases on our Python deps. Dependabot opens lockfile-bumping
# PRs that flow through the same checks and review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Actions are discovered from .github/workflows/; "/" is the repo root.
    directory: "/"
    schedule:
      interval: "weekly"
    # Match this repo's `<type>: <subject>` convention (see CONTRIBUTING.md).
    commit-message:
      prefix: "chore"
    # The catch-all group below means action bumps usually arrive as a single
    # PR; this explicit cap documents that ceiling rather than leaving it to
    # the default, mirroring the uv entry.
    open-pull-requests-limit: 5
    # Batch all action bumps into one weekly PR instead of one PR per action,
    # so a routine update fires a single CI matrix run, not three.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    # Reads pyproject.toml + uv.lock at the repo root (the same files CI's
    # `uv sync` uses), covering runtime deps and the dev/anthropic/openai extras.
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    # Grouped minor/patch is one PR; the rest of this budget caps how many
    # individual major-bump PRs can be open at once (explicit, not the default).
    open-pull-requests-limit: 5
    # Batch routine minor/patch bumps into a single weekly PR (one CI run),
    # but let major bumps open individually — they're more likely to break and
    # deserve their own review and CI matrix.
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
