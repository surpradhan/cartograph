[project]
name = "cartograph"
version = "0.1.0"
description = "Cartograph — autonomous deep research agent, fully local, zero API keys"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "langgraph>=0.4.0",
    "langchain>=1.3.10",
    "langchain-ollama>=0.3.0",
    "langchain-community>=0.3.0",
    "ddgs>=1.0.0",
    "faiss-cpu>=1.14.3",
    "sentence-transformers>=3.4.0",
    "gradio>=6.18.0",
    "httpx>=0.27.0",  # required by ddgs; pin to avoid breaking changes
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]
anthropic = [
    "langchain-anthropic>=0.3.0",
]
openai = [
    "langchain-openai>=1.3.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
